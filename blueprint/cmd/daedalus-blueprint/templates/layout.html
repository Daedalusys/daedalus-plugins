{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Daedalus · 蓝图管理（本机）</title>
<style>
/* ============================================================
   Design tokens
   浅色为主。深色为简单反色兜底（prefers-color-scheme: dark），不精修。
   ============================================================ */
:root {
  --bg: #f4f3ef;          /* 纸面底色，略带暖灰，避免刺眼的纯白 */
  --surface: #ffffff;
  --surface-2: #eceae4;   /* 表头、次级区块 */
  --ink: #1d1f23;         /* 主文字 */
  --ink-2: #4a4f57;       /* 次要文字，对比度 ≥ 7:1 */
  --ink-3: #6b717b;       /* 辅助说明，对比度 ≥ 4.5:1 */
  --line: #d6d3ca;
  --line-strong: #b9b5a8;
  --accent: #1f4e79;      /* 冷蓝：导航、焦点、普通按钮 */
  --accent-ink: #ffffff;
  --focus: #0b5cad;
  --add-bg: #e3f4e6;  --add-ink: #14532d;  --add-mark: #1a7f37;
  --del-bg: #fbe4e4;  --del-ink: #7a1212;  --del-mark: #b42318;
  --danger: #a4161a;      /* 危险动作：深红 */
  --danger-bg: #fdecea;
  --danger-line: #c0392b;
  --warn-bg: #fff4d6;  --warn-ink: #6b4a00;
  --ok: #1a7f37;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --radius: 4px;
}

@media (prefers-color-scheme: dark) {
  /* 简单反色兜底：保证可读，不做品牌化调整 */
  :root {
    --bg: #17181b; --surface: #202227; --surface-2: #2a2d33;
    --ink: #e8e8e6; --ink-2: #c3c6cc; --ink-3: #9aa0a9;
    --line: #3a3e46; --line-strong: #555b65;
    --accent: #8ab4e0; --accent-ink: #0d1117; --focus: #9cc8ff;
    --add-bg: #15301f; --add-ink: #9fe0b1; --add-mark: #4ac26b;
    --del-bg: #3a1716; --del-ink: #ffb4ab; --del-mark: #ff7b72;
    --danger: #ff8a80; --danger-bg: #3a1716; --danger-line: #ff6b5e;
    --warn-bg: #3a3112; --warn-ink: #f5d98a; --ok: #4ac26b;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.5 var(--sans);
  min-height: 100vh;
}

/* 焦点可见：所有可交互元素统一 */
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* 减少动效偏好 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- 顶栏：只放身份与状态，不做 hero ---------- */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 20px;
  background: var(--ink);
  color: var(--bg);
  border-bottom: 3px solid var(--accent);
}
.topbar .brand { font-weight: 700; letter-spacing: .02em; }
.topbar .brand small { font-weight: 400; opacity: .7; margin-left: 6px; }
.topbar .bind {
  margin-left: auto;
  font: 12px/1 var(--mono);
  padding: 4px 8px;
  border: 1px solid currentColor;
  border-radius: var(--radius);
  opacity: .85;
}

/* ---------- Tab：三视图切换 ---------- */
.tabs {
  display: flex; gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 0 20px;
  position: sticky; top: 0; z-index: 5;
}
.tabs [role="tab"] {
  appearance: none; background: none; border: 0;
  padding: 12px 16px 10px;
  font: inherit; font-weight: 600; color: var(--ink-2);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
}
.tabs [role="tab"]:hover { color: var(--ink); }
.tabs [role="tab"][aria-selected="true"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tabs [role="tab"] .step {
  display: inline-block; min-width: 18px; text-align: center;
  font: 11px/18px var(--mono);
  border: 1px solid currentColor; border-radius: 9px;
  margin-right: 6px; opacity: .8;
}

main { padding: 20px; max-width: 1200px; }
[role="tabpanel"][hidden] { display: none; }

h1.view-title {
  font-size: 18px; margin: 0 0 4px; font-weight: 700;
}
p.view-lead { margin: 0 0 16px; color: var(--ink-2); }

/* ---------- 视图一：蓝图列表 ---------- */
.bp-table {
  width: 100%; border-collapse: collapse;
  background: var(--surface);
  border: 1px solid var(--line);
}
.bp-table th, .bp-table td {
  text-align: left; vertical-align: top;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.bp-table thead th {
  background: var(--surface-2);
  font-size: 12px; font-weight: 600; color: var(--ink-2);
  text-transform: none; letter-spacing: .02em;
  border-bottom: 1px solid var(--line-strong);
}
.bp-table tbody tr:last-child td { border-bottom: 0; }
.bp-table tbody tr:hover { background: #faf9f6; }
@media (prefers-color-scheme: dark) { .bp-table tbody tr:hover { background: #26292f; } }

.bp-name { font-weight: 600; }
.bp-id { font: 12px var(--mono); color: var(--ink-3); display: block; margin-top: 2px; }
.bp-desc { color: var(--ink-2); max-width: 46ch; }
.bp-res {
  font: 12px/1.4 var(--mono);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip {
  display: inline-block;
  font: 11px/1 var(--mono);
  padding: 3px 6px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 3px;
  margin: 0 4px 4px 0;
}
.cat {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3);
}
.btn-go {
  appearance: none; font: 600 13px var(--sans);
  background: var(--surface); color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 6px 12px; cursor: pointer;
  text-decoration: none; display: inline-block; white-space: nowrap;
}
.btn-go:hover { background: var(--accent); color: var(--accent-ink); }

/* ---------- 视图二/三：表单 + 预览 ---------- */
.layout {
  display: grid;
  grid-template-columns: minmax(280px, 340px) 1fr;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.panel > header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
  background: var(--surface-2);
  border-radius: var(--radius) var(--radius) 0 0;
  display: flex; align-items: center; gap: 8px;
}
.panel > .body { padding: 14px; }

label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 4px; }
label:first-child { margin-top: 0; }
.hint { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; margin-top: 2px; }

select, input[type="text"], input[type="url"], textarea {
  width: 100%;
  font: 13px var(--mono);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 7px 9px;
}
select { font-family: var(--sans); }

.check { display: flex; gap: 8px; align-items: center; font-weight: 500; margin-top: 12px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.btn {
  appearance: none; font: 600 13px var(--sans);
  border-radius: var(--radius);
  padding: 8px 14px; cursor: pointer;
  border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink);
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }

/* 危险动作：红色边框 + 红色实心 + 警示条，三重信号，不只靠颜色 */
.btn-danger {
  background: var(--danger);
  border: 2px solid var(--danger);
  color: #fff;
  font-weight: 700;
  padding: 9px 16px;
  box-shadow: 0 0 0 3px var(--danger-bg);
}
.btn-danger:hover { filter: brightness(.92); }
.btn-danger::before { content: "⚠ "; }
.btn-danger:disabled { background: var(--surface-2); color: var(--ink-3); border-color: var(--line-strong); box-shadow: none; }
.btn-danger:disabled::before { content: ""; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

/* 确认令牌倒计时 */
.token {
  margin-top: 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: var(--surface-2);
  font-size: 12px;
}
.token .row { display: flex; justify-content: space-between; gap: 8px; }
.token code { font: 12px var(--mono); word-break: break-all; color: var(--ink-2); }
.token .ttl { font: 600 13px var(--mono); color: var(--ink); }
.token.expiring { border-color: var(--warn-ink); background: var(--warn-bg); color: var(--warn-ink); }
.token.expired  { border-color: var(--danger-line); background: var(--danger-bg); color: var(--danger); }
.token.expired .ttl { color: var(--danger); }

/* 预览区 */
.meta {
  display: flex; flex-wrap: wrap; gap: 8px 16px;
  font: 12px var(--mono); color: var(--ink-2);
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.meta b { color: var(--ink); font-weight: 600; }

.diffwrap {
  font: 12.5px/1.55 var(--mono);
  overflow: auto;
  max-height: 480px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  tab-size: 4;
}
.diffwrap .ln {
  display: grid; grid-template-columns: 3.5em 3.5em 1.5em 1fr;
  white-space: pre;
  min-width: max-content;
}
.diffwrap .ln > span { padding: 0 6px; }
.diffwrap .no { color: var(--ink-3); text-align: right; user-select: none; background: var(--surface-2); }
.diffwrap .sign { text-align: center; user-select: none; font-weight: 700; }
.diffwrap .ln.add { background: var(--add-bg); color: var(--add-ink); }
.diffwrap .ln.add .sign { color: var(--add-mark); }
.diffwrap .ln.del { background: var(--del-bg); color: var(--del-ink); }
.diffwrap .ln.del .sign { color: var(--del-mark); }
.diffwrap .ln.hunk { background: var(--surface-2); color: var(--ink-3); }
/* 每个 hunk 的分隔不靠颜色单独承担：加 / 删 都有符号 + 色块 */

.diffsum { display: flex; gap: 12px; font: 12px var(--mono); padding: 8px 14px; border-bottom: 1px solid var(--line); }
.diffsum .add-n { color: var(--add-mark); font-weight: 700; }
.diffsum .del-n { color: var(--del-mark); font-weight: 700; }

pre.raw {
  margin: 0; padding: 12px 14px;
  font: 12.5px/1.55 var(--mono);
  overflow: auto; max-height: 360px;
  background: var(--surface);
}
details { border-top: 1px solid var(--line); }
details > summary {
  cursor: pointer; padding: 8px 14px; font-weight: 600; color: var(--ink-2);
}

/* 状态条：错误 / 成功 */
.notice {
  margin: 0 0 12px; padding: 10px 12px;
  border: 1px solid var(--line-strong); border-left-width: 4px;
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 13px;
}
.notice.err  { border-left-color: var(--danger-line); background: var(--danger-bg); color: var(--danger); }
.notice.ok   { border-left-color: var(--ok); }
.notice.warn { border-left-color: var(--warn-ink); background: var(--warn-bg); color: var(--warn-ink); }
.notice b { display: block; margin-bottom: 2px; }

/* 应用结果 */
.result-grid {
  display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px;
  font: 13px var(--mono); padding: 12px 14px;
}
.result-grid dt { color: var(--ink-3); }
.result-grid dd { margin: 0; }
.yes { color: var(--ok); font-weight: 700; }
.no  { color: var(--danger); font-weight: 700; }

/* 底部小字 */
.foot { margin-top: 24px; color: var(--ink-3); font-size: 12px; }

/* 屏幕阅读器专用 */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* 跳过链接 */
.skip {
  position: absolute; left: 8px; top: -40px;
  background: var(--surface); padding: 6px 10px; z-index: 10;
}
.skip:focus { top: 8px; }
</style>
</head>
<body>

<a class="skip" href="#main">跳到主内容</a>

<header class="topbar">
  <div class="brand">Daedalus<small>蓝图管理</small></div>
  <div class="bind" title="服务只监听本机回环地址">{{.Bind}} · 仅本机</div>
</header>

<nav class="tabs" role="tablist" aria-label="视图">
  <button role="tab" id="tab-list"   aria-controls="view-list"   aria-selected="{{if eq .Active "list"}}true{{else}}false{{end}}"   tabindex="{{if eq .Active "list"}}0{{else}}-1{{end}}"><span class="step">1</span>蓝图列表</button>
  <button role="tab" id="tab-render" aria-controls="view-render" aria-selected="{{if eq .Active "render"}}true{{else}}false{{end}}" tabindex="{{if eq .Active "render"}}0{{else}}-1{{end}}"><span class="step">2</span>渲染预览</button>
  <button role="tab" id="tab-apply"  aria-controls="view-apply"  aria-selected="{{if eq .Active "apply"}}true{{else}}false{{end}}"  tabindex="{{if eq .Active "apply"}}0{{else}}-1{{end}}"><span class="step">3</span>应用</button>
</nav>

<main id="main">

<div class="notice err" id="ui-net-err" role="alert" hidden>
  <b>请求失败</b>
  <span>无法连接本机 UI 服务，请确认服务仍在运行。</span>
</div>

{{template "list" .}}

<section role="tabpanel" id="view-render" aria-labelledby="tab-render"{{if ne .Active "render"}} hidden{{end}}>
  <div data-frag="render">{{template "render" .}}</div>
</section>

<section role="tabpanel" id="view-apply" aria-labelledby="tab-apply"{{if ne .Active "apply"}} hidden{{end}}>
  <div data-frag="apply">{{template "apply" .}}</div>
</section>

<p class="foot">本页仅绑定 127.0.0.1，无外部资源依赖；所有配置内容均经 HTML 自动转义呈现。</p>
</main>

<script>
(function () {
  /* ---------- Tab 切换：方向键 / Home / End 可达 ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function selectTab(tab, focus) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tab.focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { selectTab(t, false); });
    t.addEventListener('keydown', function (e) {
      var n = null;
      if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
      if (e.key === 'ArrowLeft')  n = tabs[(i - 1 + tabs.length) % tabs.length];
      if (e.key === 'Home') n = tabs[0];
      if (e.key === 'End')  n = tabs[tabs.length - 1];
      if (n) { e.preventDefault(); selectTab(n, true); }
    });
  });
  function goTab(name) {
    var t = document.getElementById('tab-' + name);
    if (t) selectTab(t, true);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-goto]');
    if (b) { goTab(b.getAttribute('data-goto')); }
  });

  /* ---------- 片段替换：服务端返回的 [data-frag] 节点替换页面对应容器。
     节点里可能含 hidden 的 confirm_token 输入框；脚本只做节点搬移，
     从不读取、缓存或写入令牌值（不进 localStorage）。 ---------- */
  function replaceFragments(html) {
    var tpl = document.createElement('template');
    tpl.innerHTML = html;
    var nodes = tpl.content.querySelectorAll('[data-frag]');
    for (var i = 0; i < nodes.length; i++) {
      var name = nodes[i].getAttribute('data-frag');
      var cur = document.querySelector('[data-frag="' + name + '"]');
      if (cur) { cur.parentNode.replaceChild(nodes[i], cur); }
    }
    tick();
  }

  function netErr(on) {
    var el = document.getElementById('ui-net-err');
    if (el) { el.hidden = !on; }
  }

  function postJSON(url, payload, done) {
    var headers = { 'Content-Type': 'application/json' };
    headers['X-Daedalus-Ui'] = '1';
    fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: headers,
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.text().then(function (t) { done(res, t); });
    }).catch(function () {
      netErr(true);
    });
  }

  function formValues(form) {
    var out = {};
    var els = form.querySelectorAll('[name]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      out[el.name] = (el.type === 'checkbox') ? (el.checked ? 'on' : '') : el.value;
    }
    return out;
  }

  /* 请求中禁用按钮：双击会发两次；服务端单次令牌会兜底，UI 先挡。 */
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (form.id === 'render-form') {
      e.preventDefault();
      var btn = form.querySelector('button[type="submit"]');
      if (btn) { btn.disabled = true; }
      netErr(false);
      postJSON('/api/render',
        { name: form.getAttribute('data-blueprint'), params: formValues(form) },
        function (res, html) {
          if (btn) { btn.disabled = false; }
          replaceFragments(html);
          goTab('render');
        });
    } else if (form.id === 'apply-form') {
      e.preventDefault();
      var ab = document.getElementById('btn-apply');
      if (ab) { ab.disabled = true; }
      netErr(false);
      postJSON('/api/apply', formValues(form), function (res, html) {
        replaceFragments(html);
      });
    }
  });

  /* ---------- 应用：必须勾选确认才可点 ---------- */
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'f-confirm-danger') {
      var btn = document.getElementById('btn-apply');
      if (btn) { btn.disabled = !e.target.checked || tokenLeft() === 0; }
    }
  });

  /* ---------- 令牌倒计时（仅显示；真正的校验在服务端） ---------- */
  function tokenLeft() {
    var box = document.getElementById('token-box');
    if (!box) { return -1; }
    var t = Date.parse(box.getAttribute('data-expires-at') || '');
    if (isNaN(t)) { return -1; }
    return Math.max(0, Math.floor((t - Date.now()) / 1000));
  }
  function tick() {
    var box = document.getElementById('token-box');
    var ttl = document.getElementById('token-ttl');
    if (!box || !ttl) { return; }
    var left = tokenLeft();
    if (left < 0) { return; }
    var m = Math.floor(left / 60), s = left % 60;
    ttl.textContent = left > 0 ? '剩余 ' + m + ':' + (s < 10 ? '0' : '') + s : '已过期';
    box.classList.toggle('expiring', left > 0 && left <= 120);
    box.classList.toggle('expired', left === 0);
    var btn = document.getElementById('btn-apply');
    var danger = document.getElementById('f-confirm-danger');
    if (btn) { btn.disabled = left === 0 || !(danger && danger.checked); }
    if (left === 0) {
      var expired = document.getElementById('apply-expired');
      if (expired) { expired.hidden = false; }
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
{{end}}
