---
# daedalus-plugins 仓 CI: 各 sub-module 独立 `go build` + `go test` + i18n
# 同步校验。cap 清单的唯一事实源是 workflow 级 `env.CAPS`:build/test 与 i18n 两步
# 共用它,另有「cap 清单漂移门禁」步断言它与实际插件目录集合相等。清单不进
# job 名 —— required status check 钉的是 job 名,把计数写进名字等于开了第二
# 事实源。跨仓 release 流程见 AGENTS.md「跨仓 release 流程」段。
#
# 布局约定:daedalus-sdk 必须检出到 workspace 子目录 daedalus-sdk(GH Actions
# 不允许 checkout 逃出 GITHUB_WORKSPACE);go build 从 <cap>/ 跑时,各
# sub-module go.mod 的 `replace ... => ../daedalus-sdk` 恰好解析到该目录。
name: Plugins Test
on:
  pull_request:
    # 故意不加 paths-ignore:main 的 required status check 钉住了 job 名
    # "Test (sub-modules build + test + i18n)"。纯文档 PR 一旦被路径过滤掉,
    # 这个 check 就没有来源,合并门永挂 Expected(PR #64 只改 AGENTS.md 即栽在这)。
    # 保护规则还带 strict=true + enforce_admins=true,没有回旋余地。
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# 并发:同一 ref 同一 workflow 同时只跑一个;新 push 自动取消旧 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# 最小权限默认 contents:read。
permissions:
  contents: read

# cap 清单唯一事实源:build/test 与 i18n 两步共用,避免两处各写一份而漂移。
env:
  CAPS: "fs shell pkg sysinfo service blueprint dupe diskclean organize trace proc osstate snapshot"

jobs:
  test:
    name: Test (sub-modules build + test + i18n)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本 job 没有任何一步靠 .git/config 的 http.extraheader 取凭据
          # (build/test/i18n 校验都不需要),不留跨 step 存活的 token。
          persist-credentials: false
      - name: Checkout daedalus-sdk (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk

      - name: cap 清单漂移门禁
        # env.CAPS 是清单唯一事实源;这里断言它与「含 daedalus.plugin.json 的目录」
        # 集合**相等**(双向):多一个目录/少一个 cap 都拒,防止新插件静默不受测。
        shell: bash
        run: |
          expected="$(echo "$CAPS" | tr ' ' '\n' | sed '/^$/d' | sort)"
          actual="$(for d in */; do d="${d%/}"; [ -f "$d/daedalus.plugin.json" ] && echo "$d"; done | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "ERROR: env.CAPS 与实际插件目录不等" >&2
            echo "  仅在 CAPS: $(comm -23 <(echo "$expected") <(echo "$actual") | tr '\n' ' ')" >&2
            echo "  仅在目录: $(comm -13 <(echo "$expected") <(echo "$actual") | tr '\n' ' ')" >&2
            exit 1
          fi
          echo "OK: env.CAPS == 实际插件目录(共 $(printf '%s\n' "$expected" | grep -c .) 个)"

      - name: Set Up Go Toolchain
        # 各 sub-module 与 core 的 go.mod pins `go 1.26.0`;runner image 可能更老,显式 pin。
        # setup-go 会设 GOTOOLCHAIN=local,所以这里的版本必须 >= 被构建模块的 go 指令。
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          # 本 job 由 pull_request 触发 → 显式关掉 module cache:cache 按分支
          # 作用域共享,基础分支能读到 PR 分支写入的条目,那是 cache 投毒的读侧。
          cache: false

      - name: Materialize blueprint embed data (//go:embed 源)
        # blueprint/cmd/daedalus-blueprint/blueprints/ 是 //go:embed 的目标目录,
        # 但它是 gitignored 构建产物,CI 全新 checkout 里没有 → go build 报
        # "no matching files found";故从事实源 blueprint/blueprints/ rsync 出来。
        shell: bash
        run: |
          mkdir -p blueprint/cmd/daedalus-blueprint/blueprints
          rsync -a --delete blueprint/blueprints/ blueprint/cmd/daedalus-blueprint/blueprints/

      - name: Build & Test sub-modules
        # 每个 sub-module 独立 go build + go test(monorepo 无共享 go.mod,
        # 必须逐模块跑)。go build 产物落 <cap>/bin/。
        shell: bash
        run: |
          for cap in $CAPS; do
            echo "== $cap =="
            (cd "$cap" && mkdir -p bin && go build -trimpath -o bin/ ./cmd/...)
            (cd "$cap" && go test ./...)
          done

      - name: i18n sync validation
        # manifest 的 i18n 声明 ↔ i18n/ 实物双向校验(声明有但实物无 / 实物有
        # 但声明无均 fail)。各插件当前均无 i18n 字段与 i18n/ 目录,此门禁防
        # 未来漂移;en_US 必定位兜底约束由 copilot 侧 i18n_keys.test.sh 覆盖
        # (copilot 留 core 仓)。
        shell: bash
        run: |
          for cap in $CAPS; do
            manifest="$cap/daedalus.plugin.json"
            i18n_dir="$cap/i18n"
            declared=$(jq -r '.i18n // [] | .[]' "$manifest" 2>/dev/null || true)
            actual=""
            if [ -d "$i18n_dir" ]; then
              actual=$(find "$i18n_dir" -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | sort)
            fi
            # 声明有但实物无 → fail
            for loc in $declared; do
              if [ -n "$loc" ] && [ ! -f "$i18n_dir/$loc.json" ]; then
                echo "FAIL: $manifest 声明 i18n=$loc 但 $i18n_dir/$loc.json 不存在" >&2
                exit 1
              fi
            done
            # 实物有但声明无 → fail
            for loc in $actual; do
              if ! echo "$declared" | grep -qx "$loc"; then
                echo "FAIL: $i18n_dir/$loc.json 存在但 manifest 未声明" >&2
                exit 1
              fi
            done
            echo "i18n sync OK: $cap"
          done

  release-sync:
    # main 上的插件改动必须已发版:主仓构建镜像取的是 release 资产,不是 main 源码。
    # 未发版时镜像里是旧二进制,实机门禁会在旧二进制上判 FAIL(看起来像修复无效)。
    # 本 job 判的是 main 与 latest release 的关系,与被推的 ref 无关,所以只在 main
    # push 与手动触发时跑:特性分支上红/绿都是噪声,tag push 时 release 还没建出来,
    # 必然读不到而假红。PR 事件同理不跑(PR 的 main 本就是旧的)。
    name: Release Sync (main covered by latest release)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 需要 origin/main 与 release 锚点历史以做祖先判定;浅克隆的深度不够会让
          # merge-base --is-ancestor 拿不到共同祖先,误判"main 领先"。
          fetch-depth: 0

      - name: Verify main is covered by the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-sync.sh
