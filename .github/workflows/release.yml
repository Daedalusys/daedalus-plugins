---
# daedalus-plugins 仓 release 流水线:各 sub-module(清单见 workflow 级 `env.CAPS`)构建 + 打 *.plugin.zip 上传 GitHub release。
# 跨仓 release 流程(镜像出口 / plugin-pack 配方)单一事实源见 AGENTS.md「跨仓 release 流程」段。
#
# 触发:推送 v* tag(正式发版)或 workflow_dispatch(手动,需填 tag input)。
#
# 跨仓依赖:
#   - daedalus-sdk 检出到 workspace 子目录 daedalus-sdk(GH Actions 不允许 checkout
#     逃出 GITHUB_WORKSPACE);各 sub-module go.mod 的 `replace => ../daedalus-sdk`
#     相对链解析到该目录,同 test.yml;
#   - daedalus-plugin-pack 打包器在 daedalus-core 仓,plugins 仓没有——checkout
#     daedalus-core 到 workspace 子目录构建该二进制。它决定 zip 内的 manifest
#     规范化与逐条目 checksums,故**钉具体 commit**(env.PACKER_CORE_SHA),
#     不跟默认分支:浮动它会让同一 tag 的 zip 字节不可复现。
name: Plugins Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag(dispatch 手动发版时指定,如 v0.2.0;push v* tag 时自动取 tag)'
        required: false
        default: ''

# 并发:同一 ref 同一 workflow 同时只跑一个;新 push 自动取消旧 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# 需要 contents:write 创建 release + 上传资产。
permissions:
  contents: write

# cap 清单唯一事实源:build/test 与 i18n 两步共用,避免两处各写一份而漂移。
env:
  CAPS: "fs shell pkg sysinfo service blueprint dupe diskclean organize trace proc osstate snapshot"
  # 13 个 cap 共同 require 的 SDK 版本(唯一事实源);checkout 与校验都读它。
  SDK_VERSION: "0.1.3"
  # 打包器钉 core 的**具体 commit**(不钉分支/不钉 tag):它决定 zip 内的 manifest
  # 规范化与逐条目 checksums,浮动它会让同一 tag 的 zip 字节不可复现。
  # 抬它 = 改这一行 + 重新发版(刻意的一次跨仓变更)。
  # 该 SHA 必须含 cmd/daedalus-plugin-pack —— 下方 checkout 带 ref,查不到即当场失败。
  PACKER_CORE_SHA: "2f97dececc66d815d1c9721a49c3ee10c8bc02d5"
  # Go 工具链钉精确版本(= 各 sub-module go.mod 的 `go 1.26.0` 指令):
  # 浮动 patch 会让同一 tag 重建出的二进制(进 zip)字节不同。setup-go 设
  # GOTOOLCHAIN=local,故任何模块的 go 指令高于它都会当场失败(见版本门禁)。
  GO_VERSION: "1.26.0"

jobs:
  release:
    name: Build & Upload plugin zips
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不把 GITHUB_TOKEN 持久化进 .git/config:发布步骤用 GH_TOKEN 环境变量
          # 取凭据(见下方 Create or update GitHub release 步),不读 .git/config
          # 的 http.extraheader。本文件其余 checkout 同此。
          persist-credentials: false
      - name: Checkout daedalus-sdk (sibling, pinned tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-sdk
          path: daedalus-sdk
          ref: v${{ env.SDK_VERSION }}

      - name: SDK 版本一致性门禁
        # 发布前必过:13 个 cap 的 go.mod 与 checkout 的 tag 必须是同一个版本。
        # 否则「本 release 的 zip 是 v<SDK_VERSION> 构建的」这句话无法回查。
        shell: bash
        run: |
          bad=0
          for d in $CAPS; do
            got="$(sed -n 's/.*Daedalusys\/daedalus-sdk v\([0-9.]*\).*/\1/p' "$d/go.mod" | head -n1)"
            if [ "$got" != "$SDK_VERSION" ]; then
              echo "FAIL: $d/go.mod require SDK '$got',期望 '$SDK_VERSION'" >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "OK: $CAPS 全部 require SDK v$SDK_VERSION"

      - name: Checkout daedalus-core (sibling, for daedalus-plugin-pack, pinned commit)
        # 打包器这条边钉在具体 commit(见 env.PACKER_CORE_SHA):它决定 zip 内的
        # manifest 规范化与 checksums,跟默认分支会让同一 tag 的 zip 字节漂移。
        # ref 指向不存在的 SHA 时 checkout 当场失败 —— 这就是 pin 的自校验,
        # 且它发生在任何发布步骤之前,不会先产出半份资产。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Daedalusys/daedalus-core
          path: daedalus-core
          ref: ${{ env.PACKER_CORE_SHA }}

      - name: Set Up Go Toolchain
        # 各 sub-module 与 core 的 go.mod pins `go 1.26.0`;runner image 可能更老,显式 pin。
        # setup-go 会设 GOTOOLCHAIN=local,所以这里的版本必须 >= 被构建模块的 go 指令。
        # 钉精确版本而非 1.26.x:浮动 patch 会让同一 tag 重建出的二进制(进 zip)字节不同。
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ env.GO_VERSION }}'
          # 本 workflow 只由 tag push / workflow_dispatch 触发,不接受 PR ——
          # 缓存条目不会被 PR 分支写入,故保留 cache(发布腿提速)。
          cache: true

      - name: Go 工具链版本门禁
        # GOTOOLCHAIN=local 下工具链不会自动升级:某个模块的 go 指令高于钉死的
        # 版本时,要么编译炸、要么静默用别的工具链 —— 两种都让「这个 zip 是用哪版
        # Go 构建的」无法回查。这里显式判:各模块 go 指令 ≤ GO_VERSION,且实际
        # go 版本 == GO_VERSION(装错版本当场红,而不是等字节漂移)。
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for d in $CAPS daedalus-core; do
            want="$(awk '/^go [0-9]/{print $2; exit}' "$d/go.mod")"
            if [ -z "$want" ]; then
              echo "FAIL: $d/go.mod 没有 go 指令" >&2
              bad=1
              continue
            fi
            lo="$(printf '%s\n%s\n' "$want" "$GO_VERSION" | sort -V | sed -n '1p')"
            if [ "$lo" != "$want" ]; then
              echo "FAIL: $d/go.mod 要求 go $want,高于钉死的工具链 $GO_VERSION" >&2
              bad=1
            fi
          done
          got="$(go version | sed -n 's/^go version go\([0-9.]*\).*/\1/p')"
          if [ "$got" != "$GO_VERSION" ]; then
            echo "FAIL: 实际工具链 go${got:-<无>} != 钉死的 $GO_VERSION" >&2
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "OK: 工具链 go$GO_VERSION,各模块 go 指令均不高于它"

      - name: Build daedalus-plugin-pack (from daedalus-core)
        # 只构建打包器一个二进制(不构建 core 其余 cmd);-h 冒烟确认可执行。
        # 路径注意:checkout 的 path 是相对 GITHUB_WORKSPACE 的子目录,故 core
        # 在 daedalus-core/ 而非 ../daedalus-core 平级目录,须用子目录相对路径;
        # core 自身 go.mod 的 `replace => ../daedalus-sdk` 从该子目录出发解析到
        # 上方 SDK 检出。
        # -trimpath -buildvcs=false 与插件构建用同一套 flags:检出目录路径与
        # vcs.revision/vcs.modified 都不能进二进制,否则同一输入两次构建字节不同。
        shell: bash
        run: |
          (cd daedalus-core && go build -trimpath -buildvcs=false -o bin/daedalus-plugin-pack ./cmd/daedalus-plugin-pack)
          daedalus-core/bin/daedalus-plugin-pack -h >/dev/null && echo "pack binary OK"

      - name: Materialize blueprint embed data (//go:embed 源)
        # blueprint/cmd/daedalus-blueprint/blueprints/ 是 //go:embed 目标但为
        # gitignored 构建产物,全新 checkout 无此目录 → go build 报
        # "no matching files found";故从事实源 blueprint/blueprints/ rsync 出来。
        shell: bash
        run: |
          mkdir -p blueprint/cmd/daedalus-blueprint/blueprints
          rsync -a --delete blueprint/blueprints/ blueprint/cmd/daedalus-blueprint/blueprints/

      - name: Build plugins & pack zips
        # 每个 sub-module 独立 go build(monorepo 无共享 go.mod);zip 打到暂存
        # 目录(不在插件源目录内——若 -out 落在 -in 目录里,重跑时旧 zip 会被
        # 打进新 zip,zip-in-zip 递归膨胀)。
        # 打包源走"暂存目录"而非插件源目录:暂存只放 daedalus.plugin.json +
        # bin/daedalus-<cap>。直接 -in "$cap" 会把 cmd/*.go + go.mod + go.sum +
        # testdata 全打进 zip,解包进镜像树安装态后泄漏源码进 /opt,违反零残留
        # 断言。blueprint 的 blueprints/ 已 //go:embed 进二进制,同样不入 zip。
        # -trimpath -buildvcs=false 与打包器构建同套 flags:workflow 会 rsync
        # blueprint 嵌入数据 → 工作树天然脏 → vcs.modified 会随环境变;路径也
        # 会带上检出目录 —— 两者都必须挡在二进制之外,zip 字节才可复现。
        shell: bash
        run: |
          mkdir -p /tmp/release-zips
          for cap in $CAPS; do
            echo "== $cap =="
            (cd "$cap" && mkdir -p bin && go build -trimpath -buildvcs=false -o bin/ ./cmd/...)
            stage="/tmp/release-zips-stage/$cap"
            rm -rf "$stage"
            mkdir -p "$stage/bin"
            cp -f "$cap/daedalus.plugin.json" "$stage/daedalus.plugin.json"
            cp -f "$cap/bin/daedalus-$cap" "$stage/bin/daedalus-$cap"
            chmod 0755 "$stage/bin/daedalus-$cap"
            daedalus-core/bin/daedalus-plugin-pack -in "$stage" -out "/tmp/release-zips/daedalus.$cap.plugin.zip"
          done
          ls -la /tmp/release-zips/

      - name: Create or update GitHub release
        # release 已存在时(重跑)只上传资产(--clobber 覆盖),不存在时创建。
        # tag 来源:push v* → 自动取 tag;workflow_dispatch → 必须填 tag input。
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow 表达式必须先经 env 中转入 shell,不得直接内插进 run 脚本体:
          # dispatch 的 tag input 是调用方可控值,内插等于给它执行任意命令的机会。
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # tag 形态守门:只允许 vX.Y.Z(可带 -pre 后缀),挡住空白/换行/路径等 gh 参数注入形态。
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: tag 非法(应为 vX.Y.Z),got: [$TAG]" >&2
            exit 1
          fi
          # 说明文本由 env.CAPS 派生:新增 cap 只改一处,不硬编码数量与名单。
          NOTES="$(printf "%s 个能力插件 zip(%s)。daedalus-core 镜像构建经 scripts/fetch-plugins.sh 解包本 release 的全部 *.plugin.zip 进 /opt/daedalus/plugins —— 解包哪些由本 release 的资产集决定;镜像侧允许集合另由 daedalus-core 的 files/scripts/76-daedalus-plugin-gen.sh 里的 CAPS 把关。\n" "$(echo "$CAPS" | wc -w)" "$CAPS")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/release-zips/*.plugin.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --target "$GITHUB_SHA":dispatch 创建的 release/tag 默认落**默认分支**
            # HEAD;显式指向本次 run 的实际 commit,保证 tag 落点与构建产物源码一致。
            gh release create "$TAG" /tmp/release-zips/*.plugin.zip --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "daedalus-plugins $TAG"
          fi
          # 已存在的 release 重跑时也必须刷新说明(上面的 create 分支不会走到);
          # 不刷新就会像 v0.2.1 那样:资产已是全部能力件、页面却停在写死旧数量的文案。
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"